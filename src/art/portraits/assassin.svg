  <path d="M300 160C240 200 230 270 260 360H300Z" fill="#5e0a18" opacity=".55"/>
  <path d="M0 200C40 180 70 230 60 290C52 330 20 350 0 360Z" fill="url(#assassin-halftone)" opacity=".8"/>
  <path d="M190 0H300V120C260 110 230 60 190 0Z" fill="url(#assassin-halftone)" opacity=".6"/>
  <g fill="none" stroke="#e8475c" stroke-width="2.5">
    <circle cx="44" cy="58" r="17"/>
    <circle cx="262" cy="196" r="11"/>
    <circle cx="30" cy="250" r="7"/>
  </g>
  <g fill="#e8475c" opacity=".7">
