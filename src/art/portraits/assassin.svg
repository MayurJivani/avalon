    <path d="M108 160C130 172 172 172 196 158" fill="none" stroke="#2c2630" stroke-width="3"/>
    <path d="M106 178C128 190 170 190 198 174" fill="none" stroke="#2c2630" stroke-width="3"/>
    <path d="M120 196C114 220 104 244 92 262C112 256 126 240 136 224C138 214 136 204 134 198" fill="#0b0a0d" stroke-width="4"/>
    <path d="M118 210C114 226 108 240 100 252" fill="none" stroke="#2c2630" stroke-width="2.5"/>

