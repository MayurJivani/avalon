    <path d="M86 196C80 214 66 230 48 242C70 240 90 230 104 218Z" fill="#2c2630" stroke="none"/>
    <path d="M222 112C226 140 220 170 232 196C238 210 248 224 260 236C240 228 224 212 216 190C210 166 218 140 222 112Z" fill="#3a1018" stroke="none"/>
