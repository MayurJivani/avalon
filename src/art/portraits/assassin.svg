  <!-- falling drop -->
  <path d="M232 140C235 146 236 150 233 153C230 155 227 153 227 150C227 146 230 144 232 140Z" fill="#b3122e" stroke="#0b0a0d" stroke-width="1.8"/>

  <rect width="300" height="360" filter="url(#assassin-grain)" opacity=".22"/>
</svg>
