    <path d="M216 214C244 178 252 122 206 56C226 108 222 168 198 210Z" fill="#9aa3ad" stroke-width="4.5"/>
    <path d="M216 214C244 178 252 122 206 56C232 110 230 166 208 212Z" fill="#5d6670" stroke="none"/>
    <path d="M208 72C226 112 222 160 204 202" fill="none" stroke="#efe4c8" stroke-width="3"/>
    <path d="M216 214C244 178 252 122 206 56C226 108 222 168 198 210Z" fill="none" stroke-width="4.5"/>
