    <path d="M226 286C238 306 244 330 244 360M212 300C220 316 224 334 224 356" fill="none" stroke="#2c2630" stroke-width="3"/>
    <path d="M200 270C214 276 228 274 240 266" fill="none" stroke="#3a1018" stroke-width="3"/>
